<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PIN Test</title>
<style>
body { background:#0b1120; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:sans-serif; }
.pin-box { background:#111827; border:1px solid rgba(0,212,255,0.15); border-radius:20px; padding:36px 28px; text-align:center; width:320px; }
.pin-title { color:white; font-size:1.4rem; font-weight:700; margin-bottom:16px; }
.pin-dots { display:flex; justify-content:center; gap:12px; margin-bottom:20px; }
.pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid #00d4ff; background:transparent; }
.pin-dot.filled { background:#00d4ff; }
.pin-keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.pin-key { padding:16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:12px; color:white; font-size:1.2rem; font-weight:700; cursor:pointer; }
.pin-key.del { background:rgba(255,77,109,0.1); color:#ff4d6d; }
.pin-error { color:#ff4d6d; font-size:0.82rem; min-height:20px; }
#status { color:#00ffb0; margin-top:12px; font-size:0.9rem; }
</style>
</head>
<body>
<div class="pin-box">
  <div class="pin-title">🔐 PIN TEST</div>
  <div class="pin-dots">
    <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    <div class="pin-dot" id="pd4"></div><div class="pin-dot" id="pd5"></div>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-keypad" id="pin-keypad"></div>
  <div id="status"></div>
</div>
<script>
var entry = '';
var pin = '112358';

function buildKp() {
  var kp = document.getElementById('pin-keypad');
  var keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  keys.forEach(function(k) {
    var b = document.createElement('button');
    b.className = 'pin-key' + (k==='del'?' del':'');
    b.textContent = k==='del' ? '⌫' : k;
    if (k==='') { b.style.visibility='hidden'; kp.appendChild(b); return; }
    b.addEventListener('click', function(){ k==='del' ? del() : add(k); });
    kp.appendChild(b);
  });
}

function dots() {
  for(var i=0;i<6;i++) document.getElementById('pd'+i).classList.toggle('filled', i<entry.length);
}

function add(k) {
  document.getElementById('status').textContent = 'Pressed: ' + k;
  if(entry.length>=6) return;
  entry+=k; dots();
  document.getElementById('pin-error').textContent='';
  if(entry.length===6) setTimeout(check,150);
}

function del() {
  entry=entry.slice(0,-1); dots();
}

function check() {
  if(entry===pin) {
    document.getElementById('status').textContent='✅ Correct PIN!';
  } else {
    document.getElementById('pin-error').textContent='❌ Wrong PIN';
    entry=''; dots();
  }
}

window.addEventListener('load', buildKp);
</script>
</body>
</html>
